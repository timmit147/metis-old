name: Publish Public Code API

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: code-api
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build code index
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: timmit147
          # Komma-gescheiden lijst. Leeg = alles meenemen (ook metis).
          EXCLUDE_REPOS: ""
          # Van deze repos wordt de broncode als 1 tekstbestand gepubliceerd:
          # https://timmit147.github.io/metis/<repo>.txt
          CONTENT_REPOS: "metis"
        run: |
          mkdir -p public

          python - <<'PY'
          import os, json, urllib.request, urllib.parse
          from pathlib import Path

          user = os.environ["GH_USER"]
          token = os.environ["GH_TOKEN"]
          excluded = {r.strip() for r in os.environ.get("EXCLUDE_REPOS", "").split(",") if r.strip()}
          content_repos = {r.strip() for r in os.environ.get("CONTENT_REPOS", "").split(",") if r.strip()}

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def get_text(url):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req) as r:
                  return r.read().decode("utf-8", errors="replace")

          repos = []
          page = 1
          while True:
              batch = get(
                  f"https://api.github.com/users/{user}/repos"
                  f"?per_page=100&type=public&sort=updated&page={page}"
              )
              if not batch:
                  break
              repos.extend(batch)
              page += 1

          BLOCKED_NAMES = {".env", ".env.local", "secrets.json", "credentials.json"}
          BLOCKED_SUFFIXES = (".pem", ".key", ".p12", ".pfx", ".jks", ".keystore")
          TEXT_SUFFIXES = (
              ".kt", ".kts", ".java", ".xml", ".cpp", ".c", ".h", ".txt",
              ".yml", ".yaml", ".gradle", ".properties", ".json", ".md",
              ".html", ".css", ".js", ".pro", ".toml", ".sql", ".php",
          )
          MAX_CONTENT_BYTES = 1_500_000

          index = {"user": user, "repositories": []}

          for repo in repos:
              name = repo["name"]

              if name in excluded or repo["fork"]:
                  continue

              branch = repo["default_branch"]

              try:
                  tree = get(
                      f"https://api.github.com/repos/{user}/{name}"
                      f"/git/trees/{urllib.parse.quote(branch, safe='')}?recursive=1"
                  )

                  files = []

                  for item in tree.get("tree", []):
                      if item["type"] != "blob":
                          continue

                      path = item["path"]
                      size = item.get("size", 0)

                      if size > 100000:
                          continue

                      parts = path.split("/")

                      if "node_modules" in parts:
                          continue

                      if any(part.startswith(".") and part != ".github"
                             for part in parts):
                          continue

                      fname = Path(path).name.lower()
                      if fname in BLOCKED_NAMES or fname.endswith(BLOCKED_SUFFIXES):
                          continue

                      files.append({
                          "path": path,
                          "size": size,
                          "url": (
                              f"https://raw.githubusercontent.com/{user}/{name}/"
                              f"{urllib.parse.quote(branch, safe='')}/"
                              f"{urllib.parse.quote(path)}"
                          ),
                      })

                  index["repositories"].append({
                      "name": name,
                      "description": repo.get("description"),
                      "branch": branch,
                      "url": repo["html_url"],
                      "truncated": tree.get("truncated", False),
                      "files": files,
                  })

                  # Broncode van geselecteerde repos als 1 leesbaar tekstbestand
                  if name in content_repos:
                      out = []
                      total = 0
                      for f in files:
                          if not f["path"].lower().endswith(TEXT_SUFFIXES):
                              continue
                          try:
                              text = get_text(f["url"])
                          except Exception as e:
                              text = f"[could not fetch: {e}]"
                          chunk = f"\n\n===== FILE: {f['path']} =====\n{text}"
                          total += len(chunk.encode("utf-8"))
                          if total > MAX_CONTENT_BYTES:
                              out.append("\n\n[TRUNCATED: size limit reached]")
                              break
                          out.append(chunk)
                      Path(f"public/{name}.txt").write_text(
                          f"Source of {user}/{name} ({branch})" + "".join(out),
                          encoding="utf-8",
                      )
                      print(f"Wrote public/{name}.txt ({total} bytes)")

              except Exception as e:
                  print(f"Skipping {name}: {e}")

          Path("public/index.json").write_text(
              json.dumps(index, indent=2), encoding="utf-8"
          )

          Path("public/index.html").write_text(
              "<html><body><h1>Public Code API</h1>"
              "<a href='index.json'>View API JSON</a>"
              "</body></html>",
              encoding="utf-8",
          )

          print("Indexed repositories:", len(index["repositories"]))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
