name: Publish Public Code API

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: code-api
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build code index
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: timmit147
          EXCLUDE_REPOS: metis
        run: |
          mkdir -p public

          python - <<'PY'
          import os, json, urllib.request
          from pathlib import Path

          user = os.environ["GH_USER"]
          token = os.environ["GH_TOKEN"]
          excluded = set(os.environ.get("EXCLUDE_REPOS", "").split(","))

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          repos = get(
              f"https://api.github.com/users/{user}/repos"
              "?per_page=100&type=public&sort=updated"
          )

          index = {
              "user": user,
              "repositories": []
          }

          for repo in repos:
              name = repo["name"]

              if name in excluded or repo["fork"]:
                  continue

              branch = repo["default_branch"]

              try:
                  tree = get(
                      f"https://api.github.com/repos/{user}/{name}"
                      f"/git/trees/{branch}?recursive=1"
                  )

                  files = []

                  for item in tree.get("tree", []):
                      if item["type"] != "blob":
                          continue

                      path = item["path"]
                      size = item.get("size", 0)

                      if size > 100000:
                          continue

                      if any(part.startswith(".") and part != ".github"
                             for part in path.split("/")):
                          continue

                      if Path(path).name.lower() in {
                          ".env", ".env.local", "secrets.json",
                          "credentials.json"
                      }:
                          continue

                      files.append({
                          "path": path,
                          "size": size,
                          "url": (
                              f"https://raw.githubusercontent.com/"
                              f"{user}/{name}/{branch}/{path}"
                          )
                      })

                  index["repositories"].append({
                      "name": name,
                      "description": repo.get("description"),
                      "branch": branch,
                      "url": repo["html_url"],
                      "files": files
                  })

              except Exception as e:
                  print(f"Skipping {name}: {e}")

          Path("public/index.json").write_text(
              json.dumps(index, indent=2),
              encoding="utf-8"
          )

          Path("public/index.html").write_text(
              "<html><body><h1>Public Code API</h1>"
              "<a href='/index.json'>View API JSON</a>"
              "</body></html>",
              encoding="utf-8"
          )

          print("Indexed repositories:", len(index["repositories"]))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
